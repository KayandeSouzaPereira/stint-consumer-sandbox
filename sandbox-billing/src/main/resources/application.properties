quarkus.application.name=sandbox-billing
quarkus.http.port=8082
# The floci tests (-Pfloci) start the app on a random port, so a running sandbox module doesn't clash.
%test.quarkus.http.test-port=0

# --- AWS clients (Quarkus extensions, SDD 2.7) pointed at floci ----------------------------------------------
# The Scheduler extension's prefix is "eventbridge-scheduler" ("scheduler" is Quarkus's own scheduling extension).
quarkus.sqs.endpoint-override=http://localhost:4566
quarkus.dynamodb.endpoint-override=http://localhost:4566
quarkus.s3.endpoint-override=http://localhost:4566
quarkus.eventbridge.endpoint-override=http://localhost:4566
quarkus.eventbridge-scheduler.endpoint-override=http://localhost:4566
quarkus.s3.path-style-access=true
quarkus.sqs.aws.region=us-east-1
quarkus.dynamodb.aws.region=us-east-1
quarkus.s3.aws.region=us-east-1
quarkus.eventbridge.aws.region=us-east-1
quarkus.eventbridge-scheduler.aws.region=us-east-1
# floci's dummy credentials: never a real secret, never a real account.
quarkus.sqs.aws.credentials.type=static
quarkus.sqs.aws.credentials.static-provider.access-key-id=test
quarkus.sqs.aws.credentials.static-provider.secret-access-key=test
quarkus.dynamodb.aws.credentials.type=static
quarkus.dynamodb.aws.credentials.static-provider.access-key-id=test
quarkus.dynamodb.aws.credentials.static-provider.secret-access-key=test
quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.credentials.static-provider.access-key-id=test
quarkus.s3.aws.credentials.static-provider.secret-access-key=test
quarkus.eventbridge.aws.credentials.type=static
quarkus.eventbridge.aws.credentials.static-provider.access-key-id=test
quarkus.eventbridge.aws.credentials.static-provider.secret-access-key=test
quarkus.eventbridge-scheduler.aws.credentials.type=static
quarkus.eventbridge-scheduler.aws.credentials.static-provider.access-key-id=test
quarkus.eventbridge-scheduler.aws.credentials.static-provider.secret-access-key=test
quarkus.sqs.sync-client.type=url
quarkus.dynamodb.sync-client.type=url
quarkus.s3.sync-client.type=url
quarkus.eventbridge.sync-client.type=url
quarkus.eventbridge-scheduler.sync-client.type=url
# Fail-safe (SDD 2.7): no dev services container, so a misconfigured client fails instead of going elsewhere.
quarkus.devservices.enabled=false

# --- Observability (SDD 2.5) ---------------------------------------------------------------------------------
quarkus.log.console.json.enabled=true
quarkus.otel.exporter.otlp.traces.endpoint=http://localhost:4317

# --- The Billing domain's resources (created by infra/bootstrap.sh) --------------------------------------------
billing.sqs.tasks-queue-url=http://localhost:4566/000000000000/billing-tasks
billing.sqs.results-queue-url=http://localhost:4566/000000000000/billing-results
billing.sqs.timers-queue-url=http://localhost:4566/000000000000/billing-timers
billing.sqs.schedules-queue-url=http://localhost:4566/000000000000/billing-schedules
billing.sqs.domain-events-queue-url=http://localhost:4566/000000000000/billing-domain-events
billing.sqs.timers-queue-arn=arn:aws:sqs:us-east-1:000000000000:billing-timers
billing.sqs.schedules-queue-arn=arn:aws:sqs:us-east-1:000000000000:billing-schedules
billing.dynamodb.instances-table=billing-instances
billing.dynamodb.waits-table=billing-waits
billing.dynamodb.outbox-table=billing-outbox
billing.dynamodb.inbox-table=billing-inbox
# SDD S.2, 8c: invoices and the worker's effect markers (RF5).
billing.dynamodb.invoices-table=billing-invoices
billing.dynamodb.effects-table=billing-effects
billing.s3.blobs-bucket=sandbox-billing-blobs
billing.s3.facts-bucket=sandbox-facts
billing.eventbridge.domain-bus=sandbox-domain
billing.scheduler.schedules-group=billing-schedules
billing.scheduler.timers-group=billing-timers
billing.scheduler.role-arn=arn:aws:iam::000000000000:role/sandbox-scheduler
# floci doesn't substitute <aws.scheduler.scheduled-time> (SDD 2.4/2.7): emulator only, never on AWS.
billing.scheduler.sent-timestamp-fallback=true
# SDD S.1, 8d: the same jar can run as engine only, worker only, or both.
billing.engine.enabled=true
billing.worker.enabled=true

# The workflow YAMLs must be embedded for native builds.
quarkus.native.resources.includes=stint/workflows/index.txt,stint/workflows/*.yaml

# --- SDD S.2: the summary e-mail (8e) and the injected faults (RF4) -----------------------------------------
billing.mail.from=billing@sandbox.local
billing.mail.to=finance@sandbox.local
quarkus.mailer.from=billing@sandbox.local
quarkus.mailer.host=localhost
quarkus.mailer.port=1025
# quarkus-mailer mocks SMTP in dev and test by default; the sandbox always delivers to MailHog.
quarkus.mailer.mock=false
# An order id starting with "slow-" is rendered this much later (below the tasks queue's 30 s visibility).
billing.fault.slow-delay=5s
