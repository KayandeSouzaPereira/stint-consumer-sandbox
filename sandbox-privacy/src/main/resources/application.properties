quarkus.application.name=sandbox-privacy
quarkus.http.port=8093
# Tests start the app on a random port, so a running module doesn't clash.
%test.quarkus.http.test-port=0

# --- AWS clients pointed at floci, with floci's dummy credentials: never a real secret, never a real account ---
quarkus.sqs.endpoint-override=http://localhost:4566
quarkus.sqs.aws.region=us-east-1
quarkus.sqs.aws.credentials.type=static
quarkus.sqs.aws.credentials.static-provider.access-key-id=test
quarkus.sqs.aws.credentials.static-provider.secret-access-key=test
quarkus.sqs.sync-client.type=url
quarkus.s3.endpoint-override=http://localhost:4566
quarkus.s3.aws.region=us-east-1
quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.credentials.static-provider.access-key-id=test
quarkus.s3.aws.credentials.static-provider.secret-access-key=test
quarkus.s3.sync-client.type=url
quarkus.s3.path-style-access=true
# Fail-safe (SDD 2.7): no dev services container, so a misconfigured client fails instead of going elsewhere.
quarkus.devservices.enabled=false

# --- Observability (SDD 2.5) ---
quarkus.log.console.json.enabled=true
quarkus.otel.exporter.otlp.traces.endpoint=http://localhost:4317

# --- SDD S.5: queues are named by convention (infra/bootstrap.sh) under this base ---
sandbox.sqs.base-url=http://localhost:4566/000000000000/
# The pipeline corpus (synthetic only): the fakes read it. Relative to the working directory.
sandbox.corpus-dir=corpus
# --- SDD S.5, 8c: the redactor serves these callers, one queue each (privacy-tasks-<caller> -> <caller>-results) ---
privacy.callers=business,engineering,delivery
# Raw transcripts are read by pointer from any bucket; this is only the worker runtime's default store.
privacy.blobs-bucket=sandbox-meetings-raw
privacy.worker.concurrency=4

# --- SDD S.6, 8a: the model check of the layered filter. litjev (loopback only) | fake (the CI) | off ---
privacy.check=fake
privacy.check.threshold=0.5
# SDD S.6, 8f: measured with LitJev Qwen3.5-2B over the 14 real transcripts (docs/sdd/evidence/S.6-noul.txt), its noul does
# not tell redacted text from raw: 8 of 14 are at or above 0.50 either way. At 0.5 it would send 57 % of the clean
# redactions to a human. So with LitJev the layer observes: the threshold 1.01 never doubts, but a failed call does
# (fail closed). A bigger or calibrated model can lower it; the number goes in the report either way.
privacy.check.litjev.threshold=1.01
privacy.check.litjev.base-uri=http://127.0.0.1:8000
privacy.check.litjev.model=Qwen/Qwen3.5-2B
privacy.check.timeout=PT30S
