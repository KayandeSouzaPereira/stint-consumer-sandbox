# SDD S.14, RF4: Engineering holds a pointer to each node Business announced, and nothing of the node. The fact
# nodes-published (ids, types and levels) starts it; knowledge-reference writes a DomainReference per pointer in the
# architecture base and links the anchors to it, from the Business base only (a pointer of another origin, or one that
# is not a pointer, is refused). The event that follows carries the pointers the base now holds.
document:
  dsl: '1.0.0'
  namespace: engineering
  name: architecture-links
  version: '1.0.0'
  metadata:
    x-stint-policy:
      sensitivity:
        from: '${ .[0].data.label // "confidential" }'
      routes:
        restricted: [knowledge-reference]
        confidential: [knowledge-reference]
        internal: ['*']
    x-stint-knowledge:
      base: engineering-arch
      schema: architecture@1
      glossary: engineering@1
schedule:
  on:
    one:
      with: { type: io.sandbox.business.nodes-published.v1 }
do:
  - fact:
      set: '${ .[0] | {projectId: .sandboxproject, cycle: .sandboxcycle} + (.data | {domain: .domain, documentId: .documentId, upTo: .upTo, items: .items}) }'
      export: { as: '${ . }' }
  - link:
      try:
        - run:
            call: remote
            with:
              task: knowledge-reference
              input: '${ {event: {domain: $context.domain, documentId: $context.documentId, upTo: $context.upTo, items: $context.items}, anchors: [{type: "System", name: "Loans service"}], scope: {namespace: "sandbox", base: "engineering-arch"}} }'
            timeout: { after: { minutes: 2 } }
            export: { as: '${ $context + {status: .status, lastSequence: .lastSequence, references: .references, linked: .pointers} }' }
      catch:
        errors:
          with: { type: https://serverlessworkflow.io/spec/1.0.0/errors/communication }
        retry:
          delay: { seconds: 15 }
          backoff: { exponential: {} }
          limit:
            attempt: { count: 5 }
  - linked:
      emit:
        event:
          with:
            id: '${ $context.documentId + ":" + ($context.upTo | tostring) + ":references-linked" }'
            source: https://sandbox.stintflow.io/engineering
            type: io.sandbox.engineering.references-linked.v1
            subject: '${ $context.documentId }'
            sandboxproject: '${ $context.projectId }'
            sandboxcycle: '${ $context.cycle }'
            data: '${ {documentId: $context.documentId, status: $context.status, lastSequence: $context.lastSequence, references: $context.references, pointers: $context.linked} }'
      then: end
