# SDD S.14, RF5 and RF9: Engineering asks Business what the references it just linked point at. The fact references-linked
# carries the pointers; this definition resolves them — a task Business answers, by the contract of exposure of its base,
# through the view it publishes — and keeps only the status and a pointer to a blob that expires: what was resolved is never
# in the state of this instance. When Business does not answer, the author chooses here what happens: 'follow' goes on with
# a marker saying there is no content (the default), 'suspend' lets the failure end the instance for the operators.
document:
  dsl: '1.0.0'
  namespace: engineering
  name: architecture-resolve
  version: '1.0.0'
  metadata:
    x-stint-policy:
      sensitivity:
        from: '${ .[0].data.label // "confidential" }'
      routes:
        restricted: [resolve-pointers]
        confidential: [resolve-pointers]
        internal: ['*']
    x-stint-knowledge:
      base: engineering-arch
      schema: architecture@1
      glossary: engineering@1
schedule:
  on:
    one:
      with: { type: io.sandbox.engineering.references-linked.v1 }
do:
  - fact:
      set: '${ .[0] | {projectId: .sandboxproject, cycle: .sandboxcycle} + (.data | {documentId: .documentId, pointers: .pointers, onUnavailable: (.onUnavailable // "follow")}) }'
      export: { as: '${ . }' }
  - resolve:
      try:
        - run:
            call: remote
            with:
              task: resolve-pointers
              input: '${ {pointers: $context.pointers, depth: 0} }'
            timeout: { after: { seconds: 30 } }
            export: { as: '${ $context + {resolution: "resolved", viewRef: .viewRef, counts: .counts} }' }
      catch:
        errors:
          with: { type: https://serverlessworkflow.io/spec/1.0.0/errors/timeout }
        when: '$context.onUnavailable == "follow"'
        then: unavailable
  - report:
      emit:
        event:
          with:
            id: '${ $context.documentId + ":" + ($context.pointers | length | tostring) + ":" + ($context.viewRef // "none") + ":pointers-resolved" }'
            source: https://sandbox.stintflow.io/engineering
            type: io.sandbox.engineering.pointers-resolved.v1
            subject: '${ $context.documentId }'
            sandboxproject: '${ $context.projectId }'
            sandboxcycle: '${ $context.cycle }'
            data: '${ {documentId: $context.documentId, resolution: $context.resolution, viewRef: ($context.viewRef // null), counts: ($context.counts // null)} }'
      then: end
  - unavailable:
      set: '${ $context + {resolution: "unavailable"} }'
      export: { as: '${ . }' }
      then: report
