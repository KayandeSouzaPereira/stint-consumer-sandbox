# SDD S.14, RF7 and RF8: the ADRs of an architecture session, each traceable to the business decisions that motivate it.
# The fact architecture-decisions-drafted (a pointer to the draft; the draft names the decisions by pointer) starts it.
# The pairs (decision, pointer) are made; Business is asked what the pointers say, through its view; each pair is judged
# (and a conflict, or an uncertain verdict, goes to a person); the ADRs are written, one per decision, with their "motivated
# by" and the verdict; each is published on its page. An ADR still in conflict is the questions Engineering sends Business:
# the questions are written and registered, and questions-sent restarts the cycle with the next business meeting.
# When Business does not answer, the author chooses here: 'follow' judges without the context (the pair goes to a person,
# never to compatible), 'suspend' lets the failure end the instance.
document:
  dsl: '1.0.0'
  namespace: engineering
  name: architecture-adr
  version: '1.0.0'
  metadata:
    x-stint-policy:
      sensitivity:
        from: '${ .[0].data.label // "confidential" }'
      routes:
        restricted: [pair-decisions]
        confidential: [pair-decisions, resolve-pointers, pair-material, decide-conflict, write-adrs, publish-page,
                       write-conflict-questions, register-document]
        internal: ['*']
      review:
        sources: [https://portal.sandbox.example]
    x-stint-knowledge:
      base: engineering-arch
      schema: architecture@1
schedule:
  on:
    one:
      with: { type: io.sandbox.engineering.architecture-decisions-drafted.v1 }
do:
  - fact:
      set: '${ .[0] | {projectId: .sandboxproject, cycle: .sandboxcycle} + (.data | {sessionId: .sessionId, draftRef: .draftRef, label: (.label // "confidential"), onUnavailable: (.onUnavailable // "follow")}) }'
      export: { as: '${ . }' }
  - pairs:
      call: remote
      with:
        task: pair-decisions
        input: '${ {draftRef: $context.draftRef} }'
      timeout: { after: { seconds: 30 } }
      export: { as: '${ $context + {pointers: .pointers, pairs: .pairs} }' }
  - resolve:
      try:
        - run:
            call: remote
            with:
              task: resolve-pointers
              input: '${ {pointers: $context.pointers, depth: 0} }'
            timeout: { after: { seconds: 30 } }
            export: { as: '${ $context + {resolution: "resolved", viewRef: .viewRef} }' }
      catch:
        errors:
          with: { type: https://serverlessworkflow.io/spec/1.0.0/errors/communication }
        when: '$context.onUnavailable == "follow"'
        then: unavailable
  - check:
      for:
        each: pair
        in: '${ $context.pairs }'
      do:
        - pair:
            run:
              workflow:
                namespace: engineering
                name: architecture-conflict-check
                version: '1.0.0'
                input: '${ $pair + {draftRef: $context.draftRef, viewRef: ($context.viewRef // null), label: $context.label} }'
      metadata:
        x-stint-concurrency: 3
        x-stint-join: all
        x-stint-max-iterations: 50
      export: { as: '${ $context + {results: .} }' }
  - adrs:
      call: remote
      with:
        task: write-adrs
        input: '${ {meetingId: $context.sessionId, draftRef: $context.draftRef, viewRef: ($context.viewRef // null), results: [$context.results[] | {pairId: .pairId, verdict: .verdict, reviewed: .reviewed}], scope: {namespace: "sandbox", base: "engineering-arch"}} }'
      timeout: { after: { minutes: 2 } }
      export: { as: '${ $context + {adrs: .adrs} }' }
  - publish:
      for:
        each: adr
        in: '${ $context.adrs }'
      do:
        - one:
            run:
              workflow:
                namespace: engineering
                name: architecture-publish-one
                version: '1.0.0'
                input: '${ $adr + {label: $context.label} }'
      metadata:
        x-stint-concurrency: 3
        x-stint-join: all
        x-stint-max-iterations: 20
      export: { as: '${ $context + {pages: .} }' }
  - published:
      emit:
        event:
          with:
            id: '${ $context.sessionId + ":adrs-published" }'
            source: https://sandbox.stintflow.io/engineering
            type: io.sandbox.engineering.adrs-published.v1
            subject: '${ $context.sessionId }'
            sandboxproject: '${ $context.projectId }'
            sandboxcycle: '${ $context.cycle }'
            data: '${ {sessionId: $context.sessionId, resolution: ($context.resolution // "unavailable"), pages: $context.pages, counts: {decisions: ($context.pages | length), conflicting: ([$context.pages[] | select(.status == "conflicting")] | length)}} }'
  - conflicting:
      switch:
        - open: { when: '${ ([$context.pages[] | select(.status == "conflicting")] | length) > 0 }', then: askBusiness }
        - settled: { then: end }
  - askBusiness:
      call: remote
      with:
        task: write-conflict-questions
        input: '${ {projectId: $context.projectId, cycle: $context.cycle, adrs: $context.pages} }'
      export: { as: '${ $context + {questionsId: .documentId, questionsRef: .questionsRef, questionCount: .questionCount} }' }
  - registerQuestions:
      call: remote
      with:
        task: register-document
        input: '${ {documentId: $context.questionsId, documentRef: $context.questionsRef, kind: "questions", ownerRole: "tech-rep", sensitivity: "confidential", sourceMeetingId: $context.sessionId, projectId: $context.projectId, cycle: $context.cycle} }'
      export: { as: '${ $context + {questionsRecord: .} }' }
  - questionsRegistered:
      emit:
        event:
          with:
            id: '${ $context.sessionId + ":adr-questions-registered" }'
            source: https://sandbox.stintflow.io/engineering
            type: io.sandbox.records.document-registered.v1
            subject: '${ $context.questionsRecord.recordId }'
            sandboxproject: '${ $context.projectId }'
            sandboxcycle: '${ $context.cycle }'
            data: '${ $context.questionsRecord | {recordId, version, sha256, kind: "questions", sensitivity: "confidential", ownerRole: "tech-rep"} }'
  - questionsSent:
      emit:
        event:
          with:
            id: '${ $context.sessionId + ":adr-conflict:questions-sent" }'
            source: https://sandbox.stintflow.io/engineering
            type: io.sandbox.engineering.questions-sent.v1
            subject: '${ $context.questionsRecord.recordId }'
            sandboxproject: '${ $context.projectId }'
            sandboxcycle: '${ $context.cycle }'
            data: '${ {recordId: $context.questionsRecord.recordId, questionsRef: $context.questionsRef, questionCount: $context.questionCount, nextCycle: (($context.cycle | tonumber) + 1)} }'
      then: end
  - unavailable:
      set: '${ $context + {resolution: "unavailable", viewRef: null} }'
      export: { as: '${ . }' }
      then: check
