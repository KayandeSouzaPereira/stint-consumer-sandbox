quarkus.application.name=stint-consumer-sandbox
quarkus.http.port=8080

# quarkus.index-dependency.stint-aws.* is no longer needed here - stint-aws now ships its own
# META-INF/jandex.idx (jandex-maven-plugin), so its @ApplicationScoped beans are auto-discovered.

# --- S3 (Quarkus-managed client) pointed at floci -------------------------------------------------
quarkus.s3.endpoint-override=http://localhost:4566
quarkus.s3.path-style-access=true
quarkus.s3.aws.region=us-east-1
quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.credentials.static-provider.access-key-id=test
quarkus.s3.aws.credentials.static-provider.secret-access-key=test
stint.aws.s3.bucket=stint-sandbox-reports

# --- Mailer pointed at MailHog ---------------------------------------------------------------------
quarkus.mailer.host=localhost
quarkus.mailer.port=1025
quarkus.mailer.mock=false
quarkus.mailer.tls=false
quarkus.mailer.from=stint-sandbox@example.com

# SDD 1.4/1.5 style: manifest + every workflow YAML must be embedded for native builds.
quarkus.native.resources.includes=stint/workflows/index.txt,stint/workflows/*.yaml
