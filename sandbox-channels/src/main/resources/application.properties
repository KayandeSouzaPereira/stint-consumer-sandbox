quarkus.application.name=sandbox-channels
quarkus.http.port=8095
# Tests start the app on a random port, so a running module doesn't clash.
%test.quarkus.http.test-port=0

# --- AWS clients pointed at floci, with floci's dummy credentials: never a real secret, never a real account ---
quarkus.sqs.endpoint-override=http://localhost:4566
quarkus.sqs.aws.region=us-east-1
quarkus.sqs.aws.credentials.type=static
quarkus.sqs.aws.credentials.static-provider.access-key-id=test
quarkus.sqs.aws.credentials.static-provider.secret-access-key=test
quarkus.sqs.sync-client.type=url
quarkus.s3.endpoint-override=http://localhost:4566
quarkus.s3.aws.region=us-east-1
quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.credentials.static-provider.access-key-id=test
quarkus.s3.aws.credentials.static-provider.secret-access-key=test
quarkus.s3.sync-client.type=url
quarkus.eventbridge.endpoint-override=http://localhost:4566
quarkus.eventbridge.aws.region=us-east-1
quarkus.eventbridge.aws.credentials.type=static
quarkus.eventbridge.aws.credentials.static-provider.access-key-id=test
quarkus.eventbridge.aws.credentials.static-provider.secret-access-key=test
quarkus.eventbridge.sync-client.type=url
quarkus.s3.path-style-access=true
# Fail-safe (SDD 2.7): no dev services container, so a misconfigured client fails instead of going elsewhere.
quarkus.devservices.enabled=false

# --- Observability (SDD 2.5) ---
quarkus.log.console.json.enabled=true
quarkus.otel.exporter.otlp.traces.endpoint=http://localhost:4317

# --- SDD S.5: queues are named by convention (infra/bootstrap.sh) under this base ---
sandbox.sqs.base-url=http://localhost:4566/000000000000/
# The pipeline corpus (synthetic only): the fakes read it. Relative to the working directory.
sandbox.corpus-dir=corpus
# --- SDD S.5, 8c: callers of send-email and publish-page (channels-tasks-<caller> -> <caller>-results) ---
channels.callers=business,engineering,delivery
channels.worker.concurrency=4
channels.domain-events-queue=channels-domain-events
channels.domain-bus=sandbox-domain
channels.raw-bucket=sandbox-meetings-raw
channels.documents-bucket=sandbox-documents

# --- The recorder (8h): fake audio in CI; "corpus" reads corpus/audio/<id>.wav (manual run) ---
channels.recorder.audio=fake
# The fake recorder answers an invitation (refinement-requested) and the questions (questions-sent) by recording the
# corpus meeting of that project, cycle and stage. Off, a person records through POST /meetings.
channels.recorder.auto=true

# --- The fake Confluence (Stint 3a.6, embedded): fake credentials, loopback only ---
channels.confluence.space=DESIGN
channels.confluence.email=sandbox-channels@example.com
channels.confluence.token=not-a-real-token

# --- The portal (8g). TEST CREDENTIALS ONLY: synthetic users, a fixed password, never a real account. ---
# <user>=<role>; every user's password is channels.portal.test-password. The role comes from the credential.
channels.portal.source=https://portal.sandbox.example
channels.portal.test-password=test-only
channels.portal.users.test-business-rep=business-rep
channels.portal.users.test-business-lead=business-lead
channels.portal.users.test-tech-rep=tech-rep
channels.portal.users.test-technician=technician

# --- E-mail (MailHog) ---
channels.mail.from=channels@sandbox.local
quarkus.mailer.from=channels@sandbox.local
quarkus.mailer.host=localhost
quarkus.mailer.port=1025
quarkus.mailer.mock=false
